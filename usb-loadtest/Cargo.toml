[package]
name = "usb-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-usb = "0.6.0"
embassy-stm32 = { version = "0.6.0", features = ["stm32f469ni", "time-driver-any", "exti", "memory-x"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "0f4d6c3ba" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "0f4d6c3ba" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "0f4d6c3ba" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "0f4d6c3ba" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "0f4d6c3ba" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "0f4d6c3ba" }

[profile.release]
debug = true
